name: Выкладка на хостинг

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить, что доступ к FTP добавлен
        id: chk
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then echo "Секреты FTP ещё не добавлены, выкладка пропущена"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Пометить версию стилей и скриптов, чтобы браузеры не держали старые
        if: steps.chk.outputs.ok == 'true'
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" *.html admin/*.html

      - name: Залить файлы по FTP
        if: steps.chk.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            config.local.php
            _router.php
            *.sqlite
